[package]
name = "meta-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matpb/meta-mcp-rs"
description = "MCP server for the Meta Graph API: read and send Facebook Messenger (Page inbox) and WhatsApp Cloud API messages, with guided OAuth setup"
keywords = ["mcp", "mcp-server", "messenger", "whatsapp", "meta"]
categories = ["command-line-utilities", "web-programming", "api-bindings"]

[[bin]]
name = "meta-mcp"
path = "src/main.rs"

[lib]
name = "meta_mcp"

[dependencies]
rmcp = { version = "3.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "limit"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
rand = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
bytes = "1"
futures-util = "0.3"
open = "5"
rpassword = "7"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "multipart", "stream"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
